name: Deploy Angular to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Optional: run tests
      # - name: Test
      #   run: npm test -- --watch=false

      - name: Build
        env:
          # This becomes "/<repo>/" (e.g., "/my-angular-site/")
          BASE_HREF: "/${{ github.event.repository.name }}/"
        run: |
          npx ng version
          npx ng build --configuration production --base-href "${BASE_HREF}"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Upload the build output as a Pages artifact.
      # Adjust the path if your Angular output path differs.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
